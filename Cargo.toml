[package]
name = "resh"
version = "0.2.0"
edition = "2021"
description = "Resilient SSH sessions with automatic reconnection"
license = "MIT"

[dependencies]
clap = { version = "4", features = ["derive"] }
anyhow = "1"
owo-colors = "4"
base64 = "0.22"
hostname = "0.4"
libc = "0.2"
dialoguer = "0.11"
rand = "0.9"
glob = "0.3"
toml = { version = "0.8", features = ["preserve_order"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = { version = "2", features = ["serde"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
